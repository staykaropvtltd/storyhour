name: Backend CI

on:
  push:
    branches: [ "main", "Backend-Adithya" ]
  pull_request:
    branches: [ "main", "Backend-Adithya" ]

jobs:
  test:
    name: Run Isolated Backend Unit & Regression Tests
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: "StoryHour Backend API"
      ENVIRONMENT: "test"
      AUTH_MODE: "local"
      DATABASE_URL: "sqlite:///:memory:"
      SUPABASE_URL: "https://placeholder-project.supabase.co"
      SUPABASE_ANON_KEY: "placeholder-anon-key-for-isolated-ci-testing"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key-for-isolated-ci-testing"
      SUPABASE_JWT_SECRET: "ci-test-mock-secret-key-at-least-32-chars-long"
      SUPABASE_JWT_ALGORITHM: "HS256"
      JWT_AUDIENCE: "authenticated"
      RATE_LIMIT_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run safe unit test suite
        run: |
          python -m pytest backend/tests/ -v -m "not integration"
