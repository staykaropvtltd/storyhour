services:
  postgres:
    image: postgres:16-alpine
    container_name: storyhour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storyhour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - storyhour_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storyhour"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storyhour_postgres_data:
